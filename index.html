<body class="bg-[#202124] text-[#E8EAED] "  >

    <!-- ------------------------------------------------ NAV ------------------------------------- -->

    <nav class="flex justify-between items-center py-3 px-3" >

    <!-- --------------------------------- Google section -------------------------------  -->

    <div class="  mb-[1em]">
        <h2 class="text-center text-[5em] ">Google</h2>
    </div>

    <!-- ----------------------------------------Search Bar----------------------------------------- -->

    <search class="flex justify-center ">
        <div class=" relative flex items-center h-12 w-[50%] justify-center  bg-gray-600 hover:bg-gray-500 rounded-4xl ">
            <div class=" absolute   h-6 w-7  left-[0.7em] bg-contain bg-center bg-gray-500 rounded-full" style="background-image: url(./pics/computer.png);" ></div>
            <input class=" outline-none max-sm:left-12 max-sm:w-[50%] absolute left-15" type="text" name="" id="">
            <div class="max-sm:hidden absolute right-40 h-5 w-5 bg-contain bg-center bg-gray-500 rounded-full" style="background-image: url(./pics/microphone.png);"></div>
            <div class=" max-sm:hidden absolute right-30 h-5 w-5 bg-contain bg-center bg-gray-500 bg-blend " style="background-image: url(./pics/frame.png);"></div>
            <div class=" max-sm:hidden right-4 border-gray-600 flex rounded-full  items-center border-2    text-[0.75em] absolute bg-position-[center_left_4px] py-4 px-11  h-7 w-15 bg-size-[25px] bg-no-repeat bg-gray-500 " style="background-image: url(./pics/computer.png);"><h2 class=" absolute right-2 text-[1.1em]">AI Mode</h2></div>
        </div>
    </search>


    <!-- ---------------------------------------------- button ---------------------------------  -->

    <div class="flex justify-center  mt-[1em] gap-x-5">
        <button class="  px-3 rounded-xl h-10 w-40 bg-gray-950 leading-[1.2em] text-[0.9em] " > Google Search  </button>
        <button class="transition-all ease-in-out duration-500  hover:bg-size-[200%] bg-size-[5%]   border-transparent border-solid bg-origin-border bg-clip-border bg-linear-330 from-green-500 from-30%  via-blue-600 via-50% to-orange-600 to-20%  px-px py-px rounded-xl h-10 w-40  ">
            <div class=" text-[0.9em] flex h-full w-full justify-center items-center rounded-xl bg-gray-900"> Kindly Hover Me </div>
        </button>
    </div>



    <!-- --------------------------------------------------- text ----------------------------------------  -->

    <div class="mt-[3em] max-sm:flex max-sm:justify-center">
        <h2 class="text-[0.8em] text-center max-sm:w-[90%]" >Google offered in: <span class="text-blue-800"> हिन्दी বাংলা తెలుగు मराठी தமிழ் ગુજરાતી ಕನ್ನಡ മലയാളം ਪੰਜਾਬੀ </span></h2>
    </div>

    </footer>


    <footer class=" text-[15px] py-3   flex justify-between">

            <h2>Advertising</h2>
            <h2>Business</h2>
            <h2>How Search works</h2>
        </div>
     <div class=" gap-x-6 mr-10 flex max-sm:flex-col">

        <h2>Terms</h2>

     </div>
    </footer>
